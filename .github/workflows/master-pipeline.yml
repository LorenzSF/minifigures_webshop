name: Master CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY_URL"
          test -n "$EC2_HOST"
          test -n "$S3_BUCKET_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REPOSITORY_URL:${{ github.sha }}" \
            -t "$ECR_REPOSITORY_URL:latest" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "$ECR_REPOSITORY_URL:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URL:latest"

      - name: Prepare SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          test -n "$AWS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          IMAGE_URI="$ECR_REPOSITORY_URL:latest"

          ssh -i ~/.ssh/aws_key ec2-user@"$EC2_HOST" \
            "AWS_REGION='$AWS_REGION' ECR_REGISTRY='$ECR_REGISTRY' IMAGE_URI='$IMAGE_URI' S3_BUCKET_NAME='$S3_BUCKET_NAME' bash -s" <<'EOF'
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker pull "$IMAGE_URI"

          sudo mkdir -p /root/minifigures-runtime/data /root/minifigures-runtime/models

          if [ ! -d /root/minifigures-runtime/data/minifigures ] || \
             [ -z "$(sudo find /root/minifigures-runtime/data/minifigures -maxdepth 1 -name '*.png' -print -quit 2>/dev/null)" ]; then
            sudo curl -fL https://roai-data-readonly.s3.eu-central-1.amazonaws.com/minifigures.tar.gz \
              -o /root/minifigures-runtime/data/minifigures.tar.gz
            sudo tar -xzf /root/minifigures-runtime/data/minifigures.tar.gz -C /root/minifigures-runtime/data
            sudo rm -f /root/minifigures-runtime/data/minifigures.tar.gz
          fi

          sudo curl -fL https://roai-data-readonly.s3.eu-central-1.amazonaws.com/dataset.json \
            -o /root/minifigures-runtime/data/dataset.json

          aws s3 cp "s3://$S3_BUCKET_NAME/models/my_model" \
            /root/minifigures-runtime/models/my_model \
            --recursive
          test -f /root/minifigures-runtime/models/my_model/metadata.json
          test -f /root/minifigures-runtime/models/my_model/weights.pt

          docker network create kulroai-net 2>/dev/null || true
          docker stop api app 2>/dev/null || true
          docker rm api app 2>/dev/null || true

          docker run \
            -d \
            --rm \
            --network kulroai-net \
            --name api \
            -v /root/minifigures-runtime:/workspaces/minifigures-app/data \
            -p 8000:8000 \
            -e PYTHONPATH=/workspaces/minifigures-app/src \
            "$IMAGE_URI" \
            api

          docker run \
            -d \
            --rm \
            --network kulroai-net \
            --name app \
            -p 80:8500 \
            -e API_HOST=http://api \
            -e API_PORT=8000 \
            "$IMAGE_URI" \
            app
          EOF
